<text x="166.5" y="212" text-anchor="middle" font-size="22" fill="#8F3F1E">Overuse of a shared</text>

<line x1="38" y1="258" x2="295" y2="258" stroke="#8F3F1E" stroke-width="0.8" opacity="0.5"/>
<text x="38" y="286" font-size="20" font-weight="600" fill="#8F3F1E">In humans</text>

<text x="38" y="372" font-size="20" font-weight="600" fill="#8F3F1E">In LLM agents</text>
<text x="38" y="396" font-size="20" fill="#6B7787">API budgets, shared compute,</text>
<text x="38" y="419" font-size="20" fill="#6B7787">tool calls, context windows</text>

<text x="481.5" y="238" text-anchor="middle" font-size="22" fill="#8A5A0B">maintain community goods.</text>

<text x="353" y="286" font-size="20" font-weight="600" fill="#8A5A0B">In humans</text>

<text x="353" y="333" font-size="20" fill="#6B7787">unpaid moderation</text>

<text x="353" y="396" font-size="20" fill="#6B7787">helping at a personal cost,</text>
<text x="353" y="419" font-size="20" fill="#6B7787">cleanup, verifying, volunteering</text>

<text x="796.5" y="238" text-anchor="middle" font-size="22" fill="#463BA0">costly to provide.</text>

<text x="668" y="286" font-size="20" font-weight="600" fill="#463BA0">In humans</text>

<text x="668" y="333" font-size="20" fill="#6B7787">security, punishment</text>
<text x="668" y="372" font-size="20" font-weight="600" fill="#463BA0">In LLM agents</text>
<text x="668" y="396" font-size="20" fill="#6B7787">auditing, sanctioning agents,</text>
<text x="668" y="419" font-size="20" fill="#6B7787">setting new norms</text>

<text x="983" y="286" font-size="20" font-weight="600" fill="#04342C">In humans</text>
<text x="983" y="310" font-size="20" fill="#6B7787">restitution, policy reform,</text>
<text x="983" y="333" font-size="20" fill="#6B7787">disaster recovery</text>
<text x="983" y="372" font-size="20" font-weight="600" fill="#04342C">In LLM agents</text>
<text x="983" y="396" font-size="20" fill="#6B7787">cleaning corrupted memory,</text>
<text x="983" y="419" font-size="20" fill="#6B7787">retractions, undoing changes,</text>
<text x="983" y="442" font-size="20" fill="#6B7787">restoring what was lost</text>
