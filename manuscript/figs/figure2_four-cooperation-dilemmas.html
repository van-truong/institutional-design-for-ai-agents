<svg width="100%" viewBox="0 0 1500 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Four cooperation dilemmas in human and LLM-agent systems</title>
<desc>Four side-by-side cards, one per dilemma type. From left to right: the extractive dilemma (coral, depicting depletion of a shared resource), the contributive dilemma (amber, depicting failure to contribute to upkeep), the second-order dilemma (purple, depicting the cost of monitoring or enforcement), and the repair dilemma (teal, depicting restoration after harm). Each card shows a small icon, the core tension in one short sentence, a row of human examples, and a row of LLM-agent analogues.</desc>

<defs>
<marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8F3F1E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A5A0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6C5CD0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#04342C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g id="card-extractive" transform="translate(0,-52)">
<rect x="20" y="72" width="330" height="420" rx="16" fill="#FBEDE6" stroke="#8F3F1E" stroke-width="1"/>
<rect x="20" y="72" width="330" height="52" rx="16" fill="#8F3F1E"/>
<rect x="20" y="100" width="330" height="24" fill="#8F3F1E"/>
<text x="185" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#FBEDE6">Extractive dilemma</text>
<g id="icon-extractive" transform="translate(185, 180)">
<ellipse cx="0" cy="-1" rx="28" ry="4" fill="#FFF" stroke="#8F3F1E" stroke-width="0.7"/>
<rect x="-28" y="-1" width="56" height="22" fill="#FFF" stroke="none"/>
<rect x="-28" y="14" width="56" height="7" fill="#C2662A" stroke="none" opacity="0.7"/>
<line x1="-28" y1="-1" x2="-28" y2="21" stroke="#8F3F1E" stroke-width="0.7"/>
<line x1="28" y1="-1" x2="28" y2="21" stroke="#8F3F1E" stroke-width="0.7"/>
<ellipse cx="0" cy="21" rx="28" ry="4" fill="#C2662A" stroke="#8F3F1E" stroke-width="0.7" opacity="0.7"/>
<line x1="-22" y1="-24" x2="-22" y2="-6" stroke="#8F3F1E" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-coral)"/>
<line x1="0" y1="-24" x2="0" y2="-6" stroke="#8F3F1E" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-coral)"/>
<line x1="22" y1="-24" x2="22" y2="-6" stroke="#8F3F1E" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-coral)"/>
<text x="0" y="45" text-anchor="middle" font-size="18" fill="#8F3F1E" font-style="italic">depletion</text>
</g>
<text x="185" y="260" text-anchor="middle" font-size="22" fill="#8F3F1E">Overuse of a shared</text>
<text x="185" y="286" text-anchor="middle" font-size="22" fill="#8F3F1E">resource depletes it.</text>
<line x1="44" y1="310" x2="326" y2="310" stroke="#C2662A" stroke-width="0.8" opacity="0.5"/>
<text x="44" y="340" font-size="20" font-weight="500" fill="#8F3F1E">In humans</text>
<text x="44" y="370" font-size="20" fill="#6B7787">overfishing, overgrazing</text>
<!-- <text x="44" y="394" font-size="20" fill="#6B7787">overgrazing</text> -->
<text x="44" y="414" font-size="20" font-weight="500" fill="#8F3F1E">In LLM agents</text>
<text x="44" y="444" font-size="20" fill="#6B7787">API budgets, balancing shared </text>
<text x="44" y="468" font-size="20" fill="#6B7787">compute, tool calls, context</text>
<!-- <text x="44" y="492" font-size="20" fill="#6B7787">calls, context</text> -->
</g>

<g id="card-contributive" transform="translate(0,-52)">
<rect x="370" y="72" width="390" height="420" rx="16" fill="#FBEEDA" stroke="#8A5A0B" stroke-width="1"/>
<rect x="370" y="72" width="390" height="52" rx="16" fill="#8A5A0B"/>
<rect x="370" y="100" width="390" height="24" fill="#8A5A0B"/>
<text x="565" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#FBEEDA">Contributive dilemma</text>
<g id="icon-contributive" transform="translate(565, 180)">
<ellipse cx="0" cy="-1" rx="28" ry="4" fill="#FBEEDA" stroke="#8A5A0B" stroke-width="0.7"/>
<rect x="-28" y="-1" width="56" height="22" fill="#FBEEDA" stroke="none"/>
<rect x="-28" y="17" width="56" height="4" fill="#C79A3A" stroke="none" opacity="0.5"/>
<line x1="-18" y1="17" x2="-18" y2="5" stroke="#8A5A0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="0" y1="17" x2="0" y2="5" stroke="#8A5A0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="18" y1="17" x2="18" y2="5" stroke="#8A5A0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="-28" y1="-1" x2="-28" y2="21" stroke="#8A5A0B" stroke-width="0.7"/>
<line x1="28" y1="-1" x2="28" y2="21" stroke="#8A5A0B" stroke-width="0.7"/>
<ellipse cx="0" cy="21" rx="28" ry="4" fill="#C79A3A" stroke="#8A5A0B" stroke-width="0.7" opacity="0.6"/>
<g stroke="#8A5A0B" stroke-width="0.9" fill="none" stroke-linecap="round">
<line x1="-30" y1="-19" x2="-22" y2="-11"/>
<line x1="-22" y1="-19" x2="-30" y2="-11"/>
</g>
<g stroke="#8A5A0B" stroke-width="0.9" fill="none" stroke-linecap="round">
<line x1="-4" y1="-19" x2="4" y2="-11"/>
<line x1="4" y1="-19" x2="-4" y2="-11"/>
</g>
<g stroke="#8A5A0B" stroke-width="0.9" fill="none" stroke-linecap="round">
<line x1="22" y1="-19" x2="30" y2="-11"/>
<line x1="30" y1="-19" x2="22" y2="-11"/>
</g>
<text x="0" y="45" text-anchor="middle" font-size="18" fill="#8A5A0B" font-style="italic">no upkeep</text>
</g>
<text x="565" y="256" text-anchor="middle" font-size="21" fill="#8A5A0B">Beneficiaries fail to </text>
<text x="565" y="282" text-anchor="middle" font-size="21" fill="#8A5A0B">maintain community goods.</text>
<line x1="394" y1="310" x2="736" y2="310" stroke="#8A5A0B" stroke-width="0.8" opacity="0.5"/>
<text x="394" y="340" font-size="20" font-weight="500" fill="#8A5A0B">In humans</text>
<text x="394" y="370" font-size="20" fill="#6B7787">open-source upkeep, unpaid</text>
<text x="394" y="394" font-size="20" fill="#6B7787">moderation efforts</text>
<text x="394" y="414" font-size="20" font-weight="500" fill="#8A5A0B">In LLM agents</text>
<text x="394" y="444" font-size="20" fill="#6B7787">helping at a personal cost, cleanup, </text>
<text x="394" y="468" font-size="20" fill="#6B7787">verifying, volunteering</text>
</g>

<g id="card-second-order" transform="translate(0,-52)">
<rect x="780" y="72" width="330" height="420" rx="16" fill="#ECE9FB" stroke="#6C5CD0" stroke-width="1"/>
<rect x="780" y="72" width="330" height="52" rx="16" fill="#6C5CD0"/>
<rect x="780" y="100" width="330" height="24" fill="#6C5CD0"/>
<text x="945" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#ECE9FB">Second-order dilemma</text>
<g id="icon-second-order" transform="translate(945, 180)">
<path d="M -28 0 Q 0 -18 28 0 Q 0 18 -28 0 Z" fill="#FFF" stroke="#6C5CD0" stroke-width="0.9"/>
<circle cx="0" cy="0" r="7" fill="#6C5CD0"/>
<circle cx="2" cy="-2" r="2" fill="#FFF"/>
<text x="-42" y="-18" font-size="28" font-weight="500" fill="#6C5CD0">?</text>
<text x="30" y="-18" font-size="28" font-weight="500" fill="#6C5CD0">?</text>
<text x="-42" y="34" font-size="28" font-weight="500" fill="#6C5CD0">?</text>
<text x="30" y="34" font-size="28" font-weight="500" fill="#6C5CD0">?</text>
<text x="0" y="55" text-anchor="middle" font-size="18" fill="#6C5CD0" font-style="italic">who watches whom?</text>
</g>
<text x="945" y="260" text-anchor="middle" font-size="22" fill="#463BA0">Monitoring is itself</text>
<text x="945" y="286" text-anchor="middle" font-size="22" fill="#463BA0">costly to provide.</text>
<line x1="804" y1="310" x2="1086" y2="310" stroke="#6C5CD0" stroke-width="0.8" opacity="0.5"/>
<text x="804" y="340" font-size="20" font-weight="500" fill="#6C5CD0">In humans</text>
<text x="804" y="370" font-size="20" fill="#6B7787">peer monitoring, costly security, </text>
<text x="804" y="394" font-size="20" fill="#6B7787">expensive punishment</text>
<text x="804" y="414" font-size="20" font-weight="500" fill="#6C5CD0">In LLM agents</text>
<text x="804" y="444" font-size="20" fill="#6B7787">auditing, sanctioning other</text>
<text x="804" y="468" font-size="20" fill="#6B7787">agents, setting new norms</text>
</g>

<g id="card-repair" transform="translate(0,-52)">
<rect x="1130" y="72" width="350" height="420" rx="16" fill="#E3F1EC" stroke="#04342C" stroke-width="1"/>
<rect x="1130" y="72" width="350" height="52" rx="16" fill="#04342C"/>
<rect x="1130" y="100" width="350" height="24" fill="#04342C"/>
<text x="1305" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#E3F1EC">Repair dilemma</text>
<g id="icon-repair" transform="translate(1305, 180)">
<path d="M -28 -10 Q -28 -18 -20 -18 L -2 -18 L -8 -2 L -22 -2 Q -28 -2 -28 -10 Z" fill="#FFF" stroke="#04342C" stroke-width="0.9"/>
<path d="M 28 14 Q 28 22 20 22 L 4 22 L 10 6 L 24 6 Q 28 6 28 14 Z" fill="#FFF" stroke="#04342C" stroke-width="0.9"/>
<line x1="-2" y1="-18" x2="10" y2="6" stroke="#04342C" stroke-width="0.7" stroke-dasharray="2 2"/>
<line x1="-8" y1="-2" x2="4" y2="22" stroke="#04342C" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="-12" y="-2" width="24" height="10" rx="2" fill="#9FD9C7" stroke="#04342C" stroke-width="0.8" transform="rotate(28 0 3)"/>
<line x1="-7" y1="6" x2="7" y2="-1" stroke="#04342C" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
<text x="0" y="50" text-anchor="middle" font-size="18" fill="#04342C" font-style="italic">restoration</text>
</g>
<text x="1305" y="260" text-anchor="middle" font-size="22" fill="#04342C">Who bears the cost</text>
<text x="1305" y="286" text-anchor="middle" font-size="22" fill="#04342C">of fixing harm?</text>
<line x1="1154" y1="310" x2="1456" y2="310" stroke="#04342C" stroke-width="0.8" opacity="0.5"/>
<text x="1154" y="340" font-size="20" font-weight="500" fill="#04342C">In humans</text>
<text x="1154" y="364" font-size="20" fill="#6B7787">restitution, policy reform</text>
<text x="1154" y="384" font-size="20" fill="#6B7787">disaster recovery</text>
<text x="1154" y="410" font-size="20" font-weight="500" fill="#04342C">In LLM agents</text>
<text x="1154" y="430" font-size="16" fill="#6B7787">cleaning corrupted memory,</text>
<text x="1154" y="447" font-size="16" fill="#6B7787">retractions,</text>
<text x="1154" y="464" font-size="16" fill="#6B7787">reflect &amp; undo changes,</text>
<text x="1154" y="481" font-size="16" fill="#6B7787">restoring what's lost</text>
</g>

</svg>
