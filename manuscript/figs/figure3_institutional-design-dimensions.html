<svg width="100%" viewBox="0 0 680 258" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Design dimensions for cooperation-shaping institutions</title>
<desc>Top row: three enforcement-stage cards arranged left to right and connected by arrows, depicting observation, arbiter review, and enforcement. Bottom row: seven small property tiles for timing, reversibility, adaptivity, observability, gameability, repair, and scale. Each tile names a design dimension and gives a short example contrast in LLM-agent systems.</desc>

<defs>
<marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A5A0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g transform="translate(0, -48)">
<g id="stage-observer">
<rect x="10" y="58" width="200" height="120" rx="8" fill="#FBEEDA" stroke="#8A5A0B" stroke-width="0.5"/>
<rect x="10" y="58" width="200" height="26" rx="8" fill="#8A5A0B"/>
<rect x="10" y="72" width="200" height="12" fill="#8A5A0B"/>
<g transform="translate(28, 71)">
<circle cx="0" cy="0" r="9" fill="#FBEEDA" stroke="#FBEEDA" stroke-width="0.5"/>
<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#8A5A0B">1</text>
</g>
<text x="120" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#FBEEDA">Observer</text>
<text x="110" y="100" text-anchor="middle" font-size="11" fill="#8A5A0B" font-style="italic">Who can see relevant</text>
<text x="110" y="114" text-anchor="middle" font-size="11" fill="#8A5A0B" font-style="italic">behavior?</text>
<line x1="22" y1="128" x2="198" y2="128" stroke="#8A5A0B" stroke-width="0.4" opacity="0.5"/>
<text x="22" y="142" font-size="10" font-weight="500" fill="#8A5A0B">In LLM agents</text>
<text x="22" y="156" font-size="10" fill="#6B7787">peer agents, logs, monitoring systems, </text>
<text x="22" y="168" font-size="10" fill="#6B7787">human auditors</text>
</g>

<line x1="214" y1="117" x2="240" y2="117" stroke="#8A5A0B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-amber)"/>

<g id="stage-arbiter">
<rect x="244" y="58" width="200" height="120" rx="8" fill="#FBEEDA" stroke="#8A5A0B" stroke-width="0.5"/>
<rect x="244" y="58" width="200" height="26" rx="8" fill="#8A5A0B"/>
<rect x="244" y="72" width="200" height="12" fill="#8A5A0B"/>
<g transform="translate(262, 71)">
<circle cx="0" cy="0" r="9" fill="#FBEEDA" stroke="#FBEEDA" stroke-width="0.5"/>
<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#8A5A0B">2</text>
</g>
<text x="354" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#FBEEDA">Arbiter</text>
<text x="344" y="100" text-anchor="middle" font-size="11" fill="#8A5A0B" font-style="italic">Who decides whether a</text>
<text x="344" y="114" text-anchor="middle" font-size="11" fill="#8A5A0B" font-style="italic">violation occurred?</text>
<line x1="256" y1="128" x2="432" y2="128" stroke="#8A5A0B" stroke-width="0.4" opacity="0.5"/>
<text x="256" y="142" font-size="10" font-weight="500" fill="#8A5A0B">In LLM agents</text>
<text x="256" y="156" font-size="10" fill="#6B7787">rule-based checker, mediator agent, </text>
<text x="256" y="168" font-size="10" fill="#6B7787">judge, voting system, human review</text>
<text x="256" y="180" font-size="10" fill="#6B7787"></text>
</g>

<line x1="448" y1="117" x2="474" y2="117" stroke="#8A5A0B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-amber)"/>

<g id="stage-enforcer">
<rect x="478" y="58" width="200" height="120" rx="8" fill="#FBEEDA" stroke="#8A5A0B" stroke-width="0.5"/>
<rect x="478" y="58" width="200" height="26" rx="8" fill="#8A5A0B"/>
<rect x="478" y="72" width="200" height="12" fill="#8A5A0B"/>
<g transform="translate(496, 71)">
<circle cx="0" cy="0" r="9" fill="#FBEEDA" stroke="#FBEEDA" stroke-width="0.5"/>
<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#8A5A0B">3</text>
</g>
<text x="588" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#FBEEDA">Enforcer</text>
<text x="578" y="100" text-anchor="middle" font-size="11" fill="#8A5A0B" font-style="italic">Who applies the</text>
<text x="578" y="114" text-anchor="middle" font-size="11" fill="#8A5A0B" font-style="italic">sanction?</text>
<line x1="490" y1="128" x2="666" y2="128" stroke="#8A5A0B" stroke-width="0.4" opacity="0.5"/>
<text x="490" y="142" font-size="10" font-weight="500" fill="#8A5A0B">In LLM agents</text>
<text x="490" y="156" font-size="10" fill="#6B7787">peer agents, platform, tool orchestration </text>
<text x="490" y="168" font-size="10" fill="#6B7787">layers, authority figures, smart contracts</text>
</g>

<g transform="translate(0, 0)">
<g id="prop-timing">
<rect x="6" y="216" width="93" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="6" y="216" width="93" height="22" rx="6" fill="#ECE9FB"/>
<rect x="6" y="226" width="93" height="12" fill="#ECE9FB"/>
<text x="52.5" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Timing</text>
<text x="52.5" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">before or after harm?</text>
<line x1="14" y1="256" x2="91" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="52.5" y="272" text-anchor="middle" font-size="9" fill="#6B7787">ex ante rate limits</text>
<text x="52.5" y="284" text-anchor="middle" font-size="9" fill="#6B7787">vs.</text>
<text x="52.5" y="292" text-anchor="middle" font-size="9" fill="#6B7787">ex post fines</text>
</g>

<g id="prop-reversibility">
<rect x="103" y="216" width="93" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="103" y="216" width="93" height="22" rx="6" fill="#ECE9FB"/>
<rect x="103" y="226" width="93" height="12" fill="#ECE9FB"/>
<text x="149.5" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Reversibility</text>
<text x="149.5" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">can it be undone?</text>
<line x1="111" y1="256" x2="188" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="149.5" y="272" text-anchor="middle" font-size="9" fill="#6B7787">warning</text>
<text x="149.5" y="284" text-anchor="middle" font-size="9" fill="#6B7787">vs.</text>
<text x="149.5" y="292" text-anchor="middle" font-size="9" fill="#6B7787">permanent exclusion</text>
</g>

<g id="prop-adaptivity">
<rect x="200" y="216" width="93" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="200" y="216" width="93" height="22" rx="6" fill="#ECE9FB"/>
<rect x="200" y="226" width="93" height="12" fill="#ECE9FB"/>
<text x="246.5" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Adaptivity</text>
<text x="246.5" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">does it escalate?</text>
<line x1="208" y1="256" x2="285" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="246.5" y="272" text-anchor="middle" font-size="9" fill="#6B7787">graduated sanctions,</text>
<text x="246.5" y="284" text-anchor="middle" font-size="9" fill="#6B7787">re-entry conditions</text>
</g>

<g id="prop-observability">
<rect x="297" y="216" width="93" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="297" y="216" width="93" height="22" rx="6" fill="#ECE9FB"/>
<rect x="297" y="226" width="93" height="12" fill="#ECE9FB"/>
<text x="343.5" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Observability</text>
<text x="343.5" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">visible or hidden?</text>
<line x1="305" y1="256" x2="382" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="343.5" y="272" text-anchor="middle" font-size="9" fill="#6B7787">tool logs</text>
<text x="343.5" y="284" text-anchor="middle" font-size="9" fill="#6B7787">vs.</text>
<text x="343.5" y="292" text-anchor="middle" font-size="9" fill="#6B7787">private reasoning</text>
</g>

<g id="prop-gameability">
<rect x="394" y="216" width="93" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="394" y="216" width="93" height="22" rx="6" fill="#ECE9FB"/>
<rect x="394" y="226" width="93" height="12" fill="#ECE9FB"/>
<text x="440.5" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Gameability</text>
<text x="440.5" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">can it be exploited?</text>
<line x1="402" y1="256" x2="479" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="440.5" y="272" text-anchor="middle" font-size="9" fill="#6B7787">reputation farming,</text>
<text x="440.5" y="284" text-anchor="middle" font-size="9" fill="#6B7787">surface compliance</text>
</g>

<g id="prop-repair">
<rect x="491" y="216" width="93" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="491" y="216" width="93" height="22" rx="6" fill="#ECE9FB"/>
<rect x="491" y="226" width="93" height="12" fill="#ECE9FB"/>
<text x="537.5" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Repair</text>
<text x="537.5" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">does it restore?</text>
<line x1="499" y1="256" x2="576" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="537.5" y="272" text-anchor="middle" font-size="9" fill="#6B7787">memory cleanup,</text>
<text x="537.5" y="284" text-anchor="middle" font-size="9" fill="#6B7787">output correction</text>
</g>

<g id="prop-scale">
<rect x="588" y="216" width="86" height="78" rx="6" fill="#FFF" stroke="#6C5CD0" stroke-width="0.5"/>
<rect x="588" y="216" width="86" height="22" rx="6" fill="#ECE9FB"/>
<rect x="588" y="226" width="86" height="12" fill="#ECE9FB"/>
<text x="631" y="229" text-anchor="middle" font-size="11" font-weight="500" fill="#463BA0">Scale</text>
<text x="631" y="248" text-anchor="middle" font-size="9" fill="#6B7787" font-style="italic">across many agents?</text>
<line x1="596" y1="256" x2="666" y2="256" stroke="#6C5CD0" stroke-width="0.3" opacity="0.5"/>
<text x="631" y="272" text-anchor="middle" font-size="9" fill="#6B7787">local trust</text>
<text x="631" y="284" text-anchor="middle" font-size="9" fill="#6B7787">vs.</text>
<text x="631" y="292" text-anchor="middle" font-size="9" fill="#6B7787">platform-wide</text>
</g>

</g>

</g>

</svg>
