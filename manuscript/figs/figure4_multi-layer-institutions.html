      <figcaption><b>Figure 4.</b> <b>(A)</b> Stratified view of an agent-in-context:
      individual models are nested within agent&ndash;group interactions, which are nested
      within agent world models / institutions. Top-down, the institutional context shapes
      behaviour (even of aligned models); bottom-up, local interactions aggregate into
      institutions. <b>(B)</b> Design space of agent institutions: institutional mechanisms
      (information and consequence layers) and influence channels (soft and hard).
      &ldquo;Model-in-institution&rdquo; / &ldquo;agent-in-context&rdquo; can be restated as
      sets of agent&ndash;group interactions within agent world models &mdash; with
      non-trivial effects on even the most aligned individual model.</figcaption>
    </figure>
