  <title
     id="title1">Four cooperation dilemmas in human and LLM-agent systems</title>
  <desc
     id="desc1">Four side-by-side cards, one per dilemma type. From left to right: the extractive dilemma (coral, depicting depletion of a shared resource), the contributive dilemma (amber, depicting failure to contribute to upkeep), the second-order dilemma (purple, depicting the cost of monitoring or enforcement), and the repair dilemma (teal, depicting restoration after harm). Each card shows a small icon, the core tension in one short sentence, a row of human examples, and a row of LLM-agent analogues.</desc>
