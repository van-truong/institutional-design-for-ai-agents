  <title
     id="title1">Design dimensions for cooperation-shaping institutions</title>
  <desc
     id="desc1">Top row: three enforcement-stage cards arranged left to right and connected by arrows, depicting observation, adjudication, and enforcement. Bottom row: seven small property tiles for timing, reversibility, adaptivity, observability, gameability, repair, and scale. Each tile names a design dimension and gives a short example contrast in LLM-agent systems.</desc>
