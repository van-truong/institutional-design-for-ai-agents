<svg width="100%" viewBox="0 0 1500 590" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Four cooperation dilemmas in human and LLM-agent systems</title>
<desc>Four side-by-side cards, one per dilemma type. From left to right: the extractive dilemma (coral, depicting depletion of a shared resource), the contributive dilemma (amber, depicting failure to contribute to upkeep), the second-order dilemma (purple, depicting the cost of monitoring or enforcement), and the repair dilemma (teal, depicting restoration after harm). Each card shows a small icon, the core tension in one short sentence, a row of human examples, and a row of LLM-agent analogues.</desc>

<defs>
<marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="750" y="40" text-anchor="middle" font-size="28" font-weight="500" fill="#26215C">Four cooperation dilemmas in human and LLM-agent systems</text>

<g id="card-extractive">
<rect x="20" y="72" width="330" height="490" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="20" y="72" width="330" height="52" rx="16" fill="#993C1D"/>
<rect x="20" y="100" width="330" height="24" fill="#993C1D"/>
<text x="185" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#FAECE7">Extractive dilemma</text>
<g id="icon-extractive" transform="translate(185, 180)">
<ellipse cx="0" cy="-1" rx="28" ry="4" fill="#FFF" stroke="#993C1D" stroke-width="0.7"/>
<rect x="-28" y="-1" width="56" height="22" fill="#FFF" stroke="none"/>
<rect x="-28" y="14" width="56" height="7" fill="#F0997B" stroke="none" opacity="0.7"/>
<line x1="-28" y1="-1" x2="-28" y2="21" stroke="#993C1D" stroke-width="0.7"/>
<line x1="28" y1="-1" x2="28" y2="21" stroke="#993C1D" stroke-width="0.7"/>
<ellipse cx="0" cy="21" rx="28" ry="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.7" opacity="0.7"/>
<line x1="-22" y1="-24" x2="-22" y2="-6" stroke="#993C1D" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-coral)"/>
<line x1="0" y1="-24" x2="0" y2="-6" stroke="#993C1D" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-coral)"/>
<line x1="22" y1="-24" x2="22" y2="-6" stroke="#993C1D" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-coral)"/>
<text x="0" y="45" text-anchor="middle" font-size="18" fill="#993C1D" font-style="italic">depletion</text>
</g>
<text x="185" y="260" text-anchor="middle" font-size="22" fill="#4A1B0C">Overuse of a shared</text>
<text x="185" y="286" text-anchor="middle" font-size="22" fill="#4A1B0C">resource depletes it.</text>
<line x1="44" y1="310" x2="326" y2="310" stroke="#D85A30" stroke-width="0.8" opacity="0.5"/>
<text x="44" y="340" font-size="20" font-weight="500" fill="#993C1D">In humans</text>
<text x="44" y="370" font-size="20" fill="#5F5E5A">overfishing, overgrazing</text>
<!-- <text x="44" y="394" font-size="20" fill="#5F5E5A">overgrazing</text> -->
<text x="44" y="414" font-size="20" font-weight="500" fill="#993C1D">In LLM agents</text>
<text x="44" y="444" font-size="20" fill="#5F5E5A">API budgets, balancing shared </text>
<text x="44" y="468" font-size="20" fill="#5F5E5A">compute, tool calls, context</text>
<!-- <text x="44" y="492" font-size="20" fill="#5F5E5A">calls, context</text> -->
</g>

<g id="card-contributive">
<rect x="370" y="72" width="390" height="490" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<rect x="370" y="72" width="390" height="52" rx="16" fill="#854F0B"/>
<rect x="370" y="100" width="390" height="24" fill="#854F0B"/>
<text x="565" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#FAEEDA">Contributive dilemma</text>
<g id="icon-contributive" transform="translate(565, 180)">
<ellipse cx="0" cy="-1" rx="28" ry="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/>
<rect x="-28" y="-1" width="56" height="22" fill="#FAEEDA" stroke="none"/>
<rect x="-28" y="17" width="56" height="4" fill="#EF9F27" stroke="none" opacity="0.5"/>
<line x1="-18" y1="17" x2="-18" y2="5" stroke="#854F0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="0" y1="17" x2="0" y2="5" stroke="#854F0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="18" y1="17" x2="18" y2="5" stroke="#854F0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah-amber)"/>
<line x1="-28" y1="-1" x2="-28" y2="21" stroke="#854F0B" stroke-width="0.7"/>
<line x1="28" y1="-1" x2="28" y2="21" stroke="#854F0B" stroke-width="0.7"/>
<ellipse cx="0" cy="21" rx="28" ry="4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.7" opacity="0.6"/>
<g stroke="#854F0B" stroke-width="0.9" fill="none" stroke-linecap="round">
<line x1="-30" y1="-19" x2="-22" y2="-11"/>
<line x1="-22" y1="-19" x2="-30" y2="-11"/>
</g>
<g stroke="#854F0B" stroke-width="0.9" fill="none" stroke-linecap="round">
<line x1="-4" y1="-19" x2="4" y2="-11"/>
<line x1="4" y1="-19" x2="-4" y2="-11"/>
</g>
<g stroke="#854F0B" stroke-width="0.9" fill="none" stroke-linecap="round">
<line x1="22" y1="-19" x2="30" y2="-11"/>
<line x1="30" y1="-19" x2="22" y2="-11"/>
</g>
<text x="0" y="45" text-anchor="middle" font-size="18" fill="#854F0B" font-style="italic">no upkeep</text>
</g>
<text x="565" y="256" text-anchor="middle" font-size="21" fill="#412402">Beneficiaries fail to </text>
<text x="565" y="282" text-anchor="middle" font-size="21" fill="#412402">maintain community goods.</text>
<line x1="394" y1="310" x2="736" y2="310" stroke="#BA7517" stroke-width="0.8" opacity="0.5"/>
<text x="394" y="340" font-size="20" font-weight="500" fill="#854F0B">In humans</text>
<text x="394" y="370" font-size="20" fill="#5F5E5A">open-source upkeep, unpaid</text>
<text x="394" y="394" font-size="20" fill="#5F5E5A">moderation efforts</text>
<text x="394" y="414" font-size="20" font-weight="500" fill="#854F0B">In LLM agents</text>
<text x="394" y="444" font-size="20" fill="#5F5E5A">helping at a personal cost, cleanup, </text>
<text x="394" y="468" font-size="20" fill="#5F5E5A">verifying, volunteering</text>
</g>

<g id="card-second-order">
<rect x="780" y="72" width="330" height="490" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<rect x="780" y="72" width="330" height="52" rx="16" fill="#534AB7"/>
<rect x="780" y="100" width="330" height="24" fill="#534AB7"/>
<text x="945" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#EEEDFE">Second-order dilemma</text>
<g id="icon-second-order" transform="translate(945, 180)">
<path d="M -28 0 Q 0 -18 28 0 Q 0 18 -28 0 Z" fill="#FFF" stroke="#534AB7" stroke-width="0.9"/>
<circle cx="0" cy="0" r="7" fill="#534AB7"/>
<circle cx="2" cy="-2" r="2" fill="#FFF"/>
<text x="-42" y="-18" font-size="28" font-weight="500" fill="#7F77DD">?</text>
<text x="30" y="-18" font-size="28" font-weight="500" fill="#7F77DD">?</text>
<text x="-42" y="34" font-size="28" font-weight="500" fill="#7F77DD">?</text>
<text x="30" y="34" font-size="28" font-weight="500" fill="#7F77DD">?</text>
<text x="0" y="55" text-anchor="middle" font-size="18" fill="#534AB7" font-style="italic">who watches whom?</text>
</g>
<text x="945" y="260" text-anchor="middle" font-size="22" fill="#26215C">Monitoring is itself</text>
<text x="945" y="286" text-anchor="middle" font-size="22" fill="#26215C">costly to provide.</text>
<line x1="804" y1="310" x2="1086" y2="310" stroke="#7F77DD" stroke-width="0.8" opacity="0.5"/>
<text x="804" y="340" font-size="20" font-weight="500" fill="#534AB7">In humans</text>
<text x="804" y="370" font-size="20" fill="#5F5E5A">peer monitoring, costly security, </text>
<text x="804" y="394" font-size="20" fill="#5F5E5A">expensive punishment</text>
<text x="804" y="414" font-size="20" font-weight="500" fill="#534AB7">In LLM agents</text>
<text x="804" y="444" font-size="20" fill="#5F5E5A">auditing, sanctioning other</text>
<text x="804" y="468" font-size="20" fill="#5F5E5A">agents, setting new norms</text>
</g>

<g id="card-repair">
<rect x="1130" y="72" width="350" height="490" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="1130" y="72" width="350" height="52" rx="16" fill="#0F6E56"/>
<rect x="1130" y="100" width="350" height="24" fill="#0F6E56"/>
<text x="1305" y="106" text-anchor="middle" font-size="24" font-weight="500" fill="#E1F5EE">Repair dilemma</text>
<g id="icon-repair" transform="translate(1305, 180)">
<path d="M -28 -10 Q -28 -18 -20 -18 L -2 -18 L -8 -2 L -22 -2 Q -28 -2 -28 -10 Z" fill="#FFF" stroke="#0F6E56" stroke-width="0.9"/>
<path d="M 28 14 Q 28 22 20 22 L 4 22 L 10 6 L 24 6 Q 28 6 28 14 Z" fill="#FFF" stroke="#0F6E56" stroke-width="0.9"/>
<line x1="-2" y1="-18" x2="10" y2="6" stroke="#0F6E56" stroke-width="0.7" stroke-dasharray="2 2"/>
<line x1="-8" y1="-2" x2="4" y2="22" stroke="#0F6E56" stroke-width="0.7" stroke-dasharray="2 2"/>
<rect x="-12" y="-2" width="24" height="10" rx="2" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8" transform="rotate(28 0 3)"/>
<line x1="-7" y1="6" x2="7" y2="-1" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
<text x="0" y="50" text-anchor="middle" font-size="18" fill="#0F6E56" font-style="italic">restoration</text>
</g>
<text x="1305" y="260" text-anchor="middle" font-size="22" fill="#04342C">Who bears the cost</text>
<text x="1305" y="286" text-anchor="middle" font-size="22" fill="#04342C">of fixing harm?</text>
<line x1="1154" y1="310" x2="1456" y2="310" stroke="#1D9E75" stroke-width="0.8" opacity="0.5"/>
<text x="1154" y="340" font-size="20" font-weight="500" fill="#0F6E56">In humans</text>
<text x="1154" y="370" font-size="20" fill="#5F5E5A">restitution, policy reforms, disaster</text>
<text x="1154" y="394" font-size="20" fill="#5F5E5A">recovery labor</text>
<text x="1154" y="414" font-size="20" font-weight="500" fill="#0F6E56">In LLM agents</text>
<text x="1154" y="444" font-size="20" fill="#5F5E5A">cleaning corrupted memory, </text>
<text x="1154" y="468" font-size="20" fill="#5F5E5A">retractions, reflect &amp; undo changes,</text>
<text x="1154" y="492" font-size="20" fill="#5F5E5A">restoring what's lost</text>
</g>

</svg>
